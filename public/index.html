<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1923" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ValStore" />
    <meta name="description" content="Valorant günlük mağazanı telefonunda gör." />

    <title>ValStore</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- ── Views ─────────────────────────────────────────────────── -->

    <!-- Invite Code View -->
    <div id="view-invite" class="view" hidden>
      <div class="auth-container">
        <div class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,4 36,32 4,32" fill="none" stroke="#FF4655" stroke-width="2.5" stroke-linejoin="round"/>
            <line x1="20" y1="14" x2="20" y2="24" stroke="#FF4655" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="20" cy="28" r="1.5" fill="#FF4655"/>
          </svg>
        </div>
        <h1 class="app-title">ValStore</h1>
        <p class="auth-subtitle">Davet kodu gir</p>
        <form id="invite-form" class="auth-form">
          <div class="input-group">
            <input
              id="invite-input"
              type="text"
              class="text-input"
              placeholder="Davet kodu"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>
          <button type="submit" class="btn-primary" id="invite-btn">
            <span class="btn-text">Devam Et</span>
            <span class="btn-spinner" hidden></span>
          </button>
          <p id="invite-error" class="error-msg" hidden></p>
        </form>
      </div>
    </div>

    <!-- Login View -->
    <div id="view-login" class="view" hidden>
      <div class="auth-container">
        <div class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="20,4 36,32 4,32" fill="none" stroke="#FF4655" stroke-width="2.5" stroke-linejoin="round"/>
            <line x1="20" y1="14" x2="20" y2="24" stroke="#FF4655" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="20" cy="28" r="1.5" fill="#FF4655"/>
          </svg>
        </div>
        <h1 class="app-title">ValStore</h1>
        <p class="auth-subtitle">Riot hesabınla giriş yap</p>
        <form id="login-form" class="auth-form">
          <div class="input-group">
            <label class="input-label" for="username-input">Kullanıcı Adı</label>
            <input
              id="username-input"
              type="text"
              class="text-input"
              placeholder="kullanici_adi"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>
          <div class="input-group">
            <label class="input-label" for="password-input">Şifre</label>
            <div class="password-wrapper">
              <input
                id="password-input"
                type="password"
                class="text-input"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" id="password-toggle" aria-label="Şifreyi göster">
                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="login-btn">
            <span class="btn-text">Giriş Yap</span>
            <span class="btn-spinner" hidden></span>
          </button>
          <p id="login-error" class="error-msg" hidden></p>
        </form>
        <p class="auth-notice">
          Şifren yalnızca Riot sunucularına iletilir ve hiçbir yerde saklanmaz.
        </p>
      </div>
    </div>

    <!-- MFA / 2FA View -->
    <div id="view-mfa" class="view" hidden>
      <div class="auth-container">
        <div class="mfa-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF4655" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2" ry="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
          </svg>
        </div>
        <h2 class="auth-title">İki Faktörlü Doğrulama</h2>
        <p class="auth-subtitle">E-posta veya authenticator uygulamanızdaki kodu gir</p>
        <form id="mfa-form" class="auth-form">
          <div class="input-group">
            <input
              id="mfa-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="8"
              class="text-input text-center text-large"
              placeholder="123456"
              autocomplete="one-time-code"
            />
          </div>
          <button type="submit" class="btn-primary" id="mfa-btn">
            <span class="btn-text">Doğrula</span>
            <span class="btn-spinner" hidden></span>
          </button>
          <p id="mfa-error" class="error-msg" hidden></p>
        </form>
        <button class="btn-ghost" id="mfa-back-btn">← Geri dön</button>
      </div>
    </div>

    <!-- Store View -->
    <div id="view-store" class="view" hidden>
      <!-- Header -->
      <header class="store-header">
        <div class="store-header-inner">
          <div class="store-logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <polygon points="12,2 22,20 2,20" fill="none" stroke="#FF4655" stroke-width="1.8" stroke-linejoin="round"/>
              <line x1="12" y1="8" x2="12" y2="14" stroke="#FF4655" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="12" cy="17" r="1" fill="#FF4655"/>
            </svg>
            <span>ValStore</span>
          </div>
          <button class="btn-icon" id="logout-btn" aria-label="Çıkış yap" title="Çıkış yap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Timer -->
      <div class="timer-bar">
        <div class="timer-bar-inner">
          <span class="timer-label">Yenileniyor</span>
          <span class="timer-value" id="timer-display">--:--:--</span>
        </div>
      </div>

      <!-- Skins Grid -->
      <main class="store-main">
        <div id="skins-grid" class="skins-grid">
          <!-- Populated by JS -->
        </div>
      </main>

      <!-- Loading overlay -->
      <div id="store-loading" class="store-loading">
        <div class="loading-spinner"></div>
        <p>Mağaza yükleniyor...</p>
      </div>

      <!-- Error state -->
      <div id="store-error" class="store-error" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FF4655" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p id="store-error-msg"></p>
        <button class="btn-primary btn-sm" id="store-retry-btn">Tekrar Dene</button>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
